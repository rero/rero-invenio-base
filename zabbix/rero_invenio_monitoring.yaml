      - uuid: fe57bd8b86894e468a19f4a54b32cb54
        name: queue {#QUEUE} messages
        type: DEPENDENT
        key: queue_messages[{#QUEUE}]
        delay: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $['{#QUEUE}'].messages
        master_item:
          key: queues
        tags:
        - tag: Monitoring
          value: queues
      - uuid: 877802c5b6904fe19a1a9d0d06e5ea81
        name: queue {#QUEUE} consumers
        type: DEPENDENT
        key: queue_consumers[{#QUEUE}]
        delay: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $['{#QUEUE}'].consumers
        master_item:
          key: queues
        tags:
        - tag: Monitoring
          value: queues
      trigger_prototypes:
      - uuid: adafcb27bccd4b3cb00f3cff035a722d
        expression: min(/RERO Invenio Monitoring/queue_messages[{#QUEUE}],30m)>0 and max(/RERO Invenio Monitoring/queue_consumers[{#QUEUE}],30m)=0
        name: 'queue {#QUEUE}: messages waiting without consumer'
        priority: AVERAGE
        description: 'Nothing reads the queue: start its workers or the indexing tasks.'
      - uuid: 04d490d744da4aa2a6492c2262609ab5
        expression: min(/RERO Invenio Monitoring/queue_messages[{#QUEUE}],1h)>{$QUEUE.MAX:"{#QUEUE}"}
        name: 'queue {#QUEUE}: more than {$QUEUE.MAX:"{#QUEUE}"} messages for 1h'
        priority: WARNING
        description: ''
    - uuid: 6cbcd0d40a4a4fb486da6823787c2604
      name: harvest discovery
