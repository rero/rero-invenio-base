# Services required by the test suite. Only OpenSearch is defined: the tests
# need no database, cache or message queue, and `scripts/test` starts this file
# with `docker-services-cli -f ./docker-services.yml up --search opensearch`.
services:
  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-2.19.6}
    restart: "unless-stopped"
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - discovery.type=single-node
      # Plain path, not a YAML list: as an environment variable the brackets and
      # quotes are taken literally and resolved against the OpenSearch home. This
      # directory lives inside the container, so it is host-OS independent and
      # discarded with the container -- a throwaway location suited to tests.
      # Snapshot repositories are registered under it by the
      # `snapshot_repository` fixture; path.repo cannot be set at runtime.
      - path.repo=/tmp/opensearch-backup
      # Tests run without security, because the docker-services-cli healthcheck
      # polls plain HTTP on port 9200. This is the entrypoint's own switch: it
      # skips the security demo installer, so no admin password is needed. Using
      # `plugins.security.disabled` instead would still run that installer, which
      # since OpenSearch 2.12 refuses to start unless
      # OPENSEARCH_INITIAL_ADMIN_PASSWORD is set. To run *with* security, drop
      # this line, set that variable, and expect the healthcheck to need HTTPS.
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    mem_limit: 2g
    ports:
      - "9200:9200"
      - "9300:9300"
