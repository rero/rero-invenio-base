zabbix_export:
  version: '8.0'
  template_groups:
  - uuid: a432997c8c964a0e8806c8a168e2a02d
    name: hg_invenio
  - uuid: 4435f8e7985f4947abae0e23f25dd9b9
    name: HG_UNIDISTANCE
  templates:
  - uuid: 6f16674cb87f4f71bd9c7272afa06114
    template: RERO Invenio Monitoring
    name: RERO Invenio Monitoring
    description: 'Monitoring of RERO Invenio instances (rero-ils, rero-mef, sonar) through the monitoring REST API of rero-invenio-base
      (/api/monitoring/...). Set {$ADDRESS} and {$ACCESS_TOKEN} on each host; the token belongs to a user with the monitoring
      role. Override {$WEB_API} for instances without documents (rero-mef: /api/agents/mef/).'
    groups:
    - name: hg_invenio
    - name: HG_UNIDISTANCE
    items:
    - uuid: c75e9df0ccec45448e00460b24e9e01d
      name: active primary shards
      type: DEPENDENT
      key: active_primary_shards
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.active_primary_shards
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: 55aed6ef20fd453083c5b7805ee9d24d
      name: active shards
      type: DEPENDENT
      key: active_shards
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.active_shards
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: 342a19af334140909053b82373a41e1b
      name: db connections free
      type: DEPENDENT
      key: db_connections_free
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.free
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: search
      triggers:
      - uuid: 065d42e6950b432d8ec7f876ef2be610
        expression: last(/RERO Invenio Monitoring/db_connections_free)<20
        name: free db connections
        priority: AVERAGE
        description: Free DB connections on {$ADDRESS}!
    - uuid: a620b4ec9bd64663951016e2f97dc53f
      name: db connections max
      type: DEPENDENT
      key: db_connections_max
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.max
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: search
    - uuid: f416b5359f7d4ebc937a5be3f9640b9f
      name: db connections reserved
      type: DEPENDENT
      key: db_connections_reserved
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.reserved_for_super
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: search
    - uuid: 26dbcc45dd984e7d86cc5639d1f4b3cf
      name: db connections used
      type: DEPENDENT
      key: db_connections_used
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.used
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: search
    - uuid: b6bfffad42e947418fd86e3084815fa0
      name: DB connection counts
      type: HTTP_AGENT
      key: db_connection_counts
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 3s
      url: '{$ADDRESS}{$DB_CONNECTION_COUNTS}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: db
    - uuid: e47a193972db4b5ba16653414fc2e59d
      name: DB SEARCH counts
      type: HTTP_AGENT
      key: search_db_counts
      delay: 5m
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data.*
      timeout: 30s
      url: '{$ADDRESS}{$SEARCH_DB_COUNTS}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: db-search
    - uuid: 94c95cd1500542d6be35cf7fe1926e79
      name: delayed unassigned shards
      type: DEPENDENT
      key: delayed_unassigned_shards
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.delayed_unassigned_shards
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: c3b4020927c841b182677fe12322e37c
      name: SEARCH
      type: HTTP_AGENT
      key: search
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 3s
      url: '{$ADDRESS}{$SEARCH}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: search
    - uuid: bb451989660d4703ba4f70b41af327c9
      name: SEARCH INDICES
      type: HTTP_AGENT
      key: search_indices
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data.*
      timeout: 3s
      url: '{$ADDRESS}{$SEARCH_INDICES}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: search
    - uuid: 46f3318311834b87918e1002f7685e3f
      name: status
      type: DEPENDENT
      key: search_status
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.status
      - type: JAVASCRIPT
        parameters:
        - 'var state = [''green'', ''yellow'', ''red''];


          return state.indexOf(value.trim()) === -1 ? 255 : state.indexOf(value.trim());

          '
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
      triggers:
      - uuid: f1e87d6604f641cb829974db1d9fd7df
        expression: last(/RERO Invenio Monitoring/search_status)=1
        name: search status
        priority: INFO
        description: Search cluster status yellow.
      - uuid: 28a2e30c09c24d9db57e66be73eb4a4d
        expression: last(/RERO Invenio Monitoring/search_status)=2
        name: search status high
        priority: HIGH
        description: Search cluster status red.
    - uuid: 0e8c2e29b09e4747a58b7c02bfdfb20c
      name: initializing shards
      type: DEPENDENT
      key: initializing_shards
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.initializing_shards
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: bf077aa322264a988ee5ac1b843f6725
      name: number of data nodes
      type: DEPENDENT
      key: number_of_data_nodes
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_data_nodes
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: 06c61e256cec49e287a07f97694af929
      name: number of nodes
      type: DEPENDENT
      key: number_of_nodes
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_nodes
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: b36002284d95497ea9f1d1bb70e01add
      name: number of pending tasks
      type: DEPENDENT
      key: number_of_pending_tasks
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.number_of_pending_tasks
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: eca967a2d27742668c46a5e7430ad61c
      name: REDIS
      type: HTTP_AGENT
      key: redis
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 3s
      url: '{$ADDRESS}{$REDIS}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: redis
    - uuid: bce41ad20f774d5896c43e2585c11ef7
      name: relocating shards
      type: DEPENDENT
      key: relocating_shards
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.relocating_shards
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: e95bb306b7e9400090c434711e36ea95
      name: task max waiting in queue
      type: DEPENDENT
      key: task_max_waiting_in_queue
      units: ms
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.task_max_waiting_in_queue_millis
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: 396d4ad3123e4d69ac58e8525ecf4cf3
      name: unassigned shards
      type: DEPENDENT
      key: unassigned_shards
      valuemap:
        name: Search cluster state
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.unassigned_shards
      master_item:
        key: search
      tags:
      - tag: Monitoring
        value: search
    - uuid: 848452015a3241b6b67d9edc139b6eba
      name: db idle in transaction
      type: DEPENDENT
      key: db_idle_in_transaction
      delay: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.idle_in_transaction
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: db
    - uuid: da7ba61f84124b859652565212247516
      name: db oldest transaction
      type: DEPENDENT
      key: db_oldest_transaction
      delay: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.oldest_transaction
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: db
      units: s
      triggers:
      - uuid: 28c185b4c05a4f7f86829792b16e8cc6
        expression: min(/RERO Invenio Monitoring/db_oldest_transaction,10m)>{$DB.TRANSACTION.MAXAGE}
        name: transaction open for more than {$DB.TRANSACTION.MAXAGE}s
        priority: WARNING
        description: 'A transaction stays open: it holds locks and blocks vacuum. See /api/monitoring/db_connections.'
    - uuid: 7604468d59ad43c581617f1e4affbab2
      name: db size
      type: DEPENDENT
      key: db_size
      delay: '0'
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.size
      master_item:
        key: db_connection_counts
      tags:
      - tag: Monitoring
        value: db
      units: B
    - uuid: 5a5b3562ec1140a8b84b8544a48eac4f
      name: SNAPSHOTS
      type: HTTP_AGENT
      key: snapshots
      delay: 5m
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 10s
      url: '{$ADDRESS}{$SNAPSHOTS}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: snapshots
    - uuid: c8a83550bfde4f45920a538c1a16fcc4
      name: QUEUES
      type: HTTP_AGENT
      key: queues
      delay: 1m
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 10s
      url: '{$ADDRESS}{$QUEUES}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: queues
    - uuid: 2d542824272d4d9cb373135d871567f3
      name: HARVESTS
      type: HTTP_AGENT
      key: harvests
      delay: 10m
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 10s
      url: '{$ADDRESS}{$HARVESTS}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: harvests
    - uuid: acbebcaa33f4439aae766c4d4edfd0d0
      name: TIMESTAMPS
      type: HTTP_AGENT
      key: timestamps
      delay: 2m
      history: 1h
      value_type: TEXT
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.body.data
      timeout: 10s
      url: '{$ADDRESS}{$TIME_STAMPS}'
      headers:
      - name: Authorization
        value: 'Bearer {$ACCESS_TOKEN}'
      output_format: JSON
      tags:
      - tag: Monitoring
        value: timestamps
    discovery_rules:
    - uuid: 8e7c9b25ae1c4dd7baeb8ac3d2cf4252
      name: indices discovery
      type: DEPENDENT
      key: indices
      filter:
        evaltype: AND
        conditions:
        - macro: '{#INDEX}'
          value: ^operation_logs.*$
          operator: NOT_MATCHES_REGEX
        - macro: '{#INDEX}'
          value: ^top_queries-.*$
          operator: NOT_MATCHES_REGEX
        - macro: '{#INDEX}'
          value: ^\..*$
          operator: NOT_MATCHES_REGEX
      lifetime_type: DELETE_IMMEDIATELY
      item_prototypes:
      - uuid: c5bc6665c5ec4400ba8b1a996cdefe9e
        name: '{#INDEX} count'
        type: DEPENDENT
        key: count_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].['docs.count']
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 9dabd91e88624573acada0f8b2b3778a
        name: '{#INDEX} deleted %'
        type: CALCULATED
        key: deleted_percent_[{#INDEX}]
        history: 30d
        value_type: FLOAT
        units: '%'
        params: 100*last(//deleted_[{#INDEX}])/(last(//count_[{#INDEX}])+(last(//count_[{#INDEX}])=0))
        tags:
        - tag: Monitoring
          value: search
      - uuid: 72be58de312d43d1875566bf5586dea3
        name: '{#INDEX} deleted'
        type: DEPENDENT
        key: deleted_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].['docs.deleted']
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 0ae98bf39252489286dc81caaf433de2
        name: '{#INDEX} health'
        type: DEPENDENT
        key: health_[{#INDEX}]
        value_type: CHAR
        valuemap:
          name: Search cluster state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].health
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: e1a32841e834458a895e6e271ce51cd5
        name: '{#INDEX} pri'
        type: DEPENDENT
        key: pri_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].pri
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 10c16ae823334689b49cc0fa826da950
        name: '{#INDEX} rep'
        type: DEPENDENT
        key: rep_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].rep
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 326cfcb4847149b18ce9b57aa023ce32
        name: '{#INDEX} status'
        type: DEPENDENT
        key: status_[{#INDEX}]
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].status
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 74bfead4ecd74c1796b6d6df13c2669a
        name: '{#INDEX} size'
        type: DEPENDENT
        key: store.size_[{#INDEX}]
        units: bytes
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].['store.size']
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      trigger_prototypes:
      - uuid: 25e872b45f8045dd881e4dd3acba4571
        expression: last(/RERO Invenio Monitoring/count_[{#INDEX}])>1000 and last(/RERO Invenio Monitoring/deleted_[{#INDEX}])>last(/RERO
          Invenio Monitoring/count_[{#INDEX}])*0.5
        name: search index % deleted {#INDEX}
        priority: INFO
        manual_close: 'YES'
      graph_prototypes:
      - uuid: ca0cf3ed1b8f438196bdb3e93cf7e398
        name: '{#INDEX} search'
        width: '600'
        height: '100'
        show_work_period: 'NO'
        graph_items:
        - color: 1A7C11
          yaxisside: RIGHT
          calc_fnc: MIN
          item:
            host: RERO Invenio Monitoring
            key: store.size_[{#INDEX}]
        - sortorder: '1'
          color: '274482'
          calc_fnc: MIN
          item:
            host: RERO Invenio Monitoring
            key: count_[{#INDEX}]
        - sortorder: '2'
          color: F63100
          calc_fnc: MIN
          item:
            host: RERO Invenio Monitoring
            key: deleted_[{#INDEX}]
      - uuid: 8908ad63738d4cc3990d51a4ad31feb2
        name: '{#INDEX} search deleted'
        show_work_period: 'NO'
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        graph_items:
        - drawtype: FILLED_REGION
          color: 5C6BC0
          calc_fnc: ALL
          item:
            host: RERO Invenio Monitoring
            key: deleted_percent_[{#INDEX}]
      master_item:
        key: search_indices
      lld_macro_paths:
      - lld_macro: '{#INDEX}'
        path: $.index
    - uuid: e829bf499ddb4d66aa66c28124f58ca2
      name: indices discovery oplg
      type: DEPENDENT
      key: indices_oplg
      filter:
        conditions:
        - macro: '{#INDEX}'
          value: ^operation_logs.*$
      lifetime_type: DELETE_IMMEDIATELY
      item_prototypes:
      - uuid: 54ffc365896e49289d359b6d0017f844
        name: '{#INDEX} count'
        type: DEPENDENT
        key: count__oplg_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].['docs.count']
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 494156576ae14035958435f97762343d
        name: '{#INDEX} deleted'
        type: DEPENDENT
        key: deleted_oplg_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].['docs.deleted']
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: ee4c9f107be34e2799768b3ebf8af125
        name: '{#INDEX} health'
        type: DEPENDENT
        key: health_oplg_[{#INDEX}]
        value_type: CHAR
        valuemap:
          name: Search cluster state
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].health
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: da5fd040c0da41ffb5cf43603c80e879
        name: '{#INDEX} pri'
        type: DEPENDENT
        key: pri_oplg_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].pri
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 828a735685e94c09ba30010e89393b6f
        name: '{#INDEX} rep'
        type: DEPENDENT
        key: rep_oplg_[{#INDEX}]
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].rep
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 270548f4a72845d9a37787e002757c5f
        name: '{#INDEX} size'
        type: DEPENDENT
        key: size_oplg_[{#INDEX}]
        units: bytes
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].['store.size']
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      - uuid: 45c0f4a8fb9343d48f278331aed44cd7
        name: '{#INDEX} status'
        type: DEPENDENT
        key: status_oplg_[{#INDEX}]
        value_type: CHAR
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.[?(@.index=='{#INDEX}')].status
        - type: TRIM
          parameters:
          - '["]'
        master_item:
          key: search_indices
        tags:
        - tag: Monitoring
          value: search
      graph_prototypes:
      - uuid: b1a3c4ede2b544a99e84e8e017a15676
        name: '{#INDEX} search OPLG'
        graph_items:
        - color: 1A7C11
          yaxisside: RIGHT
          calc_fnc: ALL
          item:
            host: RERO Invenio Monitoring
            key: size_oplg_[{#INDEX}]
        - sortorder: '1'
          color: '274482'
          calc_fnc: ALL
          item:
            host: RERO Invenio Monitoring
            key: count__oplg_[{#INDEX}]
        - sortorder: '2'
          color: F63100
          calc_fnc: ALL
          item:
            host: RERO Invenio Monitoring
            key: deleted_oplg_[{#INDEX}]
      master_item:
        key: search_indices
      lld_macro_paths:
      - lld_macro: '{#INDEX}'
        path: $.index
    - uuid: aa9da3d7ec4341989c21c848e458a8f3
      name: record discovery
