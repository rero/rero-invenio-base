  triggers:
  - uuid: f06f2c1c53124c4ba283aa7df90a0c03
    expression: last(/RERO Invenio Monitoring/db_connections_used) + last(/RERO Invenio Monitoring/db_connections_reserved)
      >= last(/RERO Invenio Monitoring/db_connections_max) - last(/RERO Invenio Monitoring/db_connections_max)*10 / 100
    name: too many db connections
    priority: AVERAGE
    description: Too many DB connections on {$ADDRESS}!
  - uuid: 6db7a91143cb4349b72007e40813e72f
    expression: length(last(/RERO Invenio Monitoring/web.test.error[API]))>0 and last(/RERO Invenio Monitoring/web.test.fail[API])>0
    name: 'Web scenario "API" failed: {ITEM.VALUE}'
    url: '{$ADDRESS}{$WEB_API}'
    priority: AVERAGE
    description: '{$ADDRESS}{$WEB_API} API doesn''t seem to work correctly. Please check it.'
    manual_close: 'YES'
    tags:
    - tag: sla
      value: availability
  - uuid: 1577979bb1264d3da8ad6bbc6863a2bf
    expression: last(/RERO Invenio Monitoring/web.test.in[API,,bps])<300000
    name: Web scenario "API" slow
    url: '{$ADDRESS}{$WEB_API}'
    status: DISABLED
    priority: WARNING
    manual_close: 'YES'
  - uuid: 3ca08c230f3d48b8883df3a14c4bb1b9
    expression: length(last(/RERO Invenio Monitoring/web.test.error[UI]))>0 and last(/RERO Invenio Monitoring/web.test.fail[UI])>0
    name: 'Web scenario "UI" failed: {ITEM.VALUE}'
    url: '{$ADDRESS}{$WEB_UI}'
    priority: AVERAGE
    description: '{$ADDRESS}{$WEB_UI}UI doesn''t seem to work correctly. Please check it.'
    manual_close: 'YES'
    tags:
    - tag: sla
      value: availability
  - uuid: 400415635b0244d88a13ce52b1b5c267
    expression: last(/RERO Invenio Monitoring/web.test.in[UI,,bps])<30000
    name: Web scenario "UI" slow
