    - uuid: 68365d1f30fe483682d95e955f9ead64
      name: snapshot repository discovery
      type: DEPENDENT
      key: snapshot_repositories
      delay: '0'
      lifetime: 7d
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.repositories.*
      master_item:
        key: snapshots
      lld_macro_paths:
      - lld_macro: '{#REPO}'
        path: $.name
      item_prototypes:
      - uuid: c32cde1151d2495bb2de3140fbf9a91a
        name: snapshots {#REPO} last success age
        type: DEPENDENT
        key: snapshot_age[{#REPO}]
        delay: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.repositories['{#REPO}'].last_success_age
          error_handler: CUSTOM_VALUE
          error_handler_params: '999999999'
        # A source that never succeeded answers null: alert on it like on a missing one.
        - type: STR_REPLACE
          parameters:
          - 'null'
          - '999999999'
        master_item:
          key: snapshots
        tags:
        - tag: Monitoring
          value: snapshots
        units: s
      - uuid: ac55b7ec3fa94f9d9b49ccea02bda632
        name: snapshots {#REPO} count
        type: DEPENDENT
        key: snapshot_count[{#REPO}]
        delay: '0'
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.repositories['{#REPO}'].count
        master_item:
          key: snapshots
        tags:
        - tag: Monitoring
          value: snapshots
      trigger_prototypes:
      - uuid: 13fa346190e84bb4ac2525f502aff18e
        expression: last(/RERO Invenio Monitoring/snapshot_age[{#REPO}])>{$SNAPSHOT.MAXAGE:"{#REPO}"} and {$SNAPSHOT.MONITOR}=1
        name: no successful snapshot in {#REPO} for {$SNAPSHOT.MAXAGE:"{#REPO}"}s
        priority: HIGH
        description: The index backups have stopped. Set {$SNAPSHOT.MONITOR} to 0 where no snapshots are made.
    - uuid: b6fdf9083d524c1598db10976e816138
      name: queue discovery
